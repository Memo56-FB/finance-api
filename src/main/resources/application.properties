spring.application.name=financeApi
finance.business-zone=${FINANCE_BUSINESS_ZONE:America/Mexico_City}
spring.datasource.url=${FINANCE_DB_URL:jdbc:postgresql://localhost:5432/finance}
spring.datasource.username=${FINANCE_DB_USER:finance}
spring.datasource.password=${FINANCE_DB_PASSWORD}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

finance.frontend-origin=${FINANCE_FRONTEND_ORIGIN:http://localhost:3000}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
