spring.application.name=financeApi
finance.business-zone=${FINANCE_BUSINESS_ZONE:America/Mexico_City}
finance.recurring-payments.scheduling-enabled=${FINANCE_RECURRING_PAYMENTS_SCHEDULING_ENABLED:true}
finance.recurring-payments.interval=${FINANCE_RECURRING_PAYMENTS_INTERVAL:PT60S}
spring.datasource.url=${FINANCE_DB_URL:jdbc:postgresql://localhost:5432/finance}
spring.datasource.username=${FINANCE_DB_USER:finance}
spring.datasource.password=${FINANCE_DB_PASSWORD}

spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

finance.frontend-origin=${FINANCE_FRONTEND_ORIGIN:http://localhost:3000}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
